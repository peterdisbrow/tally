name: Production Smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Relay Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
      RELAY_ADMIN_EMAIL: ${{ secrets.RELAY_ADMIN_EMAIL }}
      RELAY_ADMIN_PASSWORD: ${{ secrets.RELAY_ADMIN_PASSWORD }}
    steps:
      - name: Resolve target URL
        run: |
          BASE_URL="${RELAY_BASE_URL:-https://api.tallyconnect.app}"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "Target: $BASE_URL"

      - name: Public endpoint checks
        run: |
          set -euo pipefail

          curl -fsS "$BASE_URL/api/health" -o health.json
          jq -e '
            (.uptime | type == "number")
            and (
              ((.registeredChurches // .churchesRegistered // 0) | type == "number")
            )
            and (.aiConfigured | type == "boolean")
          ' health.json >/dev/null

          curl -fsS "$BASE_URL/api/status/components" -o components.json
          jq -e '.components | type == "array" and length > 0' components.json >/dev/null
          jq -e '[.components[] | select((((.id // "") == "relay_api") or ((.name // "") == "Relay API")) and .state == "operational")] | length > 0' components.json >/dev/null

          {
            echo "## Public checks"
            echo "- PASS: \`GET /api/health\`"
            echo "- PASS: \`GET /api/health\` \`aiConfigured\` is boolean"
            echo "- PASS: \`GET /api/status/components\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require admin secrets
        run: |
          set -euo pipefail
          if [ -z "${RELAY_ADMIN_EMAIL:-}" ] || [ -z "${RELAY_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Production smoke requires repository secrets RELAY_ADMIN_EMAIL and RELAY_ADMIN_PASSWORD. Authenticated login cannot be skipped."
            {
              echo "## Authenticated checks"
              echo "- FAIL: secrets \`RELAY_ADMIN_EMAIL\` and \`RELAY_ADMIN_PASSWORD\` are required for production smoke."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Authenticated endpoint checks
        run: |
          set -euo pipefail
          set +x

          LOGIN_PAYLOAD="$(jq -n --arg email "$RELAY_ADMIN_EMAIL" --arg password "$RELAY_ADMIN_PASSWORD" '{email: $email, password: $password}')"
          HTTP_CODE="$(curl -sS -o login.json -w "%{http_code}" \
            "$BASE_URL/api/admin/login" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_PAYLOAD")"
          unset LOGIN_PAYLOAD

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Admin login failed (HTTP ${HTTP_CODE}). Production smoke is an honest can-Andrew-still-log-in check. Update RELAY_ADMIN_EMAIL and RELAY_ADMIN_PASSWORD if credentials changed."
            {
              echo "## Authenticated checks"
              echo "- FAIL: \`POST /api/admin/login\` HTTP ${HTTP_CODE}"
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f login.json
            exit 1
          fi

          TOKEN="$(jq -re '.token' login.json)"
          rm -f login.json

          curl -fsS "$BASE_URL/api/churches" \
            -H "Authorization: Bearer ${TOKEN}" \
            -o churches.json
          jq -e 'type == "array"' churches.json >/dev/null

          curl -fsS "$BASE_URL/api/billing" \
            -H "Authorization: Bearer ${TOKEN}" \
            -o billing.json
          jq -e 'type == "array"' billing.json >/dev/null

          unset TOKEN

          {
            echo "## Authenticated checks"
            echo "- PASS: \`POST /api/admin/login\`"
            echo "- PASS: \`GET /api/churches\`"
            echo "- PASS: \`GET /api/billing\`"
          } >> "$GITHUB_STEP_SUMMARY"
